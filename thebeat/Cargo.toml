[package]
name = "thebeat"
version = "0.1.0"
edition = "2024"

[features]
default = ["internet-radio", "cdio-paranoia"]
internet-radio = ["thebeat_internet_radio"]
cdio-paranoia = ["thebeat_cdio_paranoia"]

[dependencies]
gpui = { workspace = true }
smol = { workspace = true }
smol-macros = { workspace = true }
contemporary = { workspace = true }
cntp_i18n = { workspace = true }
cntp_icon_tool_macros = { workspace = true }
lthebeat = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thebeat_internet_radio = { workspace = true, optional = true }
thebeat_cdio_paranoia = { workspace = true, optional = true }

[build-dependencies]
cntp_i18n_gen = { workspace = true }