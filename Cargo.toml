[workspace]
resolver = "3"
members = ["lthebeat", "thebeat"]

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
smol = "2"
smol-macros = "0.1"
contemporary = { git = "https://github.com/vicr123/contemporary-rs" }
cntp_i18n = { git = "https://github.com/vicr123/contemporary-rs", features = ["gpui"] }
cntp_icon_tool_macros = { git = "https://github.com/vicr123/contemporary-rs" }
cntp_i18n_gen = { git = "https://github.com/vicr123/contemporary-rs" }
cpal = "0.16"
rb = "0.4"
intx = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
symphonia = "0.5"
rubato = "0.16"
url = "2.5"
async-ringbuf = "0.3.4"
image = "0.25"
smallvec = "1"
sqlx = { version = "0.8", features = ["runtime-async-std", "sqlite"] }
directories = "6"
async-walkdir = "2"
md5 = "0.7"
