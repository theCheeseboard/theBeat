name: "Linux (AppImage) CI"
on:
  push:
    branches:
      - '**'
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master
      - name: Install gstreamer
        run: |
          sudo apt-get update
          sudo apt-get install libutf8proc-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 gstreamer1.0-qt5 gstreamer1.0-pulseaudio libcdio++-dev
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          aqtversion: '==3.1.*'
          version: '6.8.0'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true
          modules: 'qt3d qtcharts qtconnectivity qtdatavis3d qtgraphs qtgrpc qthttpserver qtimageformats qtlanguageserver qtlocation qtlottie qtmultimedia qtnetworkauth qtpositioning qtquick3dphysics qtquickeffectmaker qtremoteobjects qtscxml qtsensors qtserialbus qtserialport qtspeech qtvirtualkeyboard qtwebchannel qtwebsockets qtwebview qt5compat qtquick3d qtquicktimeline qtshadertools'
      - name: Install QCoro
        uses: theCheeseboard/actions/build-cmake-project@actions
        with:
          project: danvratil/qcoro
          commitish: v0.10.0
      - name: Install utfcpp
        uses: theCheeseboard/actions/build-cmake-project@actions
        with:
          project: nemtrif/utfcpp
          commitish: v4.0.5
      - name: Install taglib
        uses: theCheeseboard/actions/build-cmake-project@actions
        with:
          project: taglib/taglib
          commitish: v2.0.1
          extra-cmake-args: -DBUILD_SHARED_LIBS=ON
      - name: Install libcontemporary
        uses: theCheeseboard/actions/build-cmake-project@actions
        with:
          project: theCheeseboard/libcontemporary
          commitish: features/qml
      - name: Install contemporary-qml
        uses: theCheeseboard/actions/build-cmake-project@actions
        with:
          project: theCheeseboard/contemporary-qml
          commitish: main
          extra-cmake-args: -DCNTP_BUNDLE_ICONS=ON
      - name: Install theFrisbee
        id: thefrisbee
        uses: theCheeseboard/actions/build-cmake-project@actions
        with:
          project: theCheeseboard/thefrisbee
          commitish: v3.0
      - name: Install thebeat
        id: thebeat
        uses: theCheeseboard/actions/build-cmake-project@actions
        with:
          project: .
          commitish: .
      - name: Deploy thebeat
        uses: theCheeseboard/actions/deploy-project@actions
        with:
          sourceDirectory: ${{ steps.thebeat.outputs.source-directory }}
          buildDirectory: ${{ steps.thebeat.outputs.build-directory }}
