[package]
name = "lthebeat"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { workspace = true }
contemporary = { workspace = true }
cpal = { workspace = true }
rb = { workspace = true }
intx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
log = "0.4.27"
symphonia = { workspace = true, features = ["all"] }
rubato = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
isahc = { version = "1", features = ["static-ssl"] }
smol = { workspace = true }
async-channel = "2"
async-ringbuf = { workspace = true }
cancellation-token = "0.1"
rand = "0.9.2"
async-lock = "3.4.1"
cntp_i18n = { workspace = true }
image = { workspace = true }
smallvec = { workspace = true }
regex = "1.11.1"
sqlx = { workspace = true }
directories = { workspace = true }
async-walkdir = { workspace = true }
sha2 = { workspace = true }
dominant_color = "0.4.0"
uuid = { workspace = true }

[build-dependencies]
cntp_i18n_gen = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSDictionary",
    "NSValue",
    "NSData",
] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-app-kit = { version = "0.3", features = ["NSImage"] }
objc2-media-player = { version = "0.3", features = ["MPNowPlayingInfoCenter"] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.9"
tempfile = "3.22"